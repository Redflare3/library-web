<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tambah / Edit Buku - Perpustakaan Umum</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/app.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-300 min-h-screen flex flex-col">

  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-10">
    <nav class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between" aria-label="Navigasi utama">
      <a href="index.html" class="text-xl font-bold text-slate-100">Perpustakaan Umum</a>
      <button id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu"
              class="md:hidden p-2 rounded-lg text-slate-300 hover:bg-slate-800">
        <span class="sr-only">Buka menu</span>
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div id="nav-menu" class="hidden w-full md:w-auto md:block mt-3 md:mt-0">
        <ul class="flex flex-col md:flex-row gap-1">
          <li><a href="index.html" class="block px-4 py-2 rounded-lg font-semibold text-slate-300 hover:bg-slate-800 hover:text-sky-400">Dashboard</a></li>
          <li><a href="daftar-buku.html" class="block px-4 py-2 rounded-lg font-semibold text-slate-300 hover:bg-slate-800 hover:text-sky-400">Daftar Buku</a></li>
          <li><a href="form-buku.html" aria-current="page" class="block px-4 py-2 rounded-lg font-semibold bg-slate-950 text-sky-400">Tambah Buku</a></li>
          <li><a href="detail-buku.html" class="block px-4 py-2 rounded-lg font-semibold text-slate-300 hover:bg-slate-800 hover:text-sky-400">Detail Buku</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-8">
    <article class="bg-slate-900 border border-slate-800 rounded-xl p-5 md:p-6">
      <h2 class="text-2xl md:text-3xl font-bold text-slate-100">Form Tambah / Edit Buku</h2>
      <p class="mt-1 text-slate-400">Isi data buku dengan lengkap. Kolom bertanda <span class="text-sky-400 font-bold">*</span> wajib diisi.</p>

      <form action="daftar-buku.html" method="post" class="mt-6">
        <fieldset class="border border-slate-800 rounded-xl p-5">
          <legend class="px-2 font-bold text-slate-100">Data Buku</legend>

          <!-- Grid form: 1 kolom (mobile), 2 kolom (md) -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label for="judul" class="block mb-1 font-bold text-slate-400">Judul *</label>
              <input type="text" id="judul" name="judul" required
                     class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-sky-500">
            </div>

            <div>
              <label for="penulis" class="block mb-1 font-bold text-slate-400">Penulis *</label>
              <input type="text" id="penulis" name="penulis" required
                     class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-sky-500">
            </div>

            <div>
              <label for="tanggal" class="block mb-1 font-bold text-slate-400">Tanggal Terbit *</label>
              <input type="date" id="tanggal" name="tanggal" required
                     class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-sky-500">
            </div>

            <div>
              <label for="kategori" class="block mb-1 font-bold text-slate-400">Kategori</label>
              <select id="kategori" name="kategori"
                      class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-sky-500">
                <option value="">Pilih kategori</option>
                <option value="fiksi">Fiksi</option>
                <option value="nonfiksi">Non-Fiksi</option>
                <option value="sains">Sains</option>
                <option value="sejarah">Sejarah</option>
                <option value="anak">Anak-anak</option>
              </select>
            </div>

            <div class="md:col-span-2">
              <label for="rak" class="block mb-1 font-bold text-slate-400">Lokasi Rak *</label>
              <input type="text" id="rak" name="rak" placeholder="Contoh: Rak B-12, Lantai 2" required
                     class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-sky-500">
            </div>

            <div>
              <label for="sampul" class="block mb-1 font-bold text-slate-400">Tautan Gambar Sampul</label>
              <input type="url" id="sampul" name="sampul"
                     class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-sky-500">
            </div>

            <div>
              <label for="ebook" class="block mb-1 font-bold text-slate-400">Tautan E-book</label>
              <input type="url" id="ebook" name="ebook"
                     class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-sky-500">
            </div>

            <div class="md:col-span-2">
              <label for="sinopsis" class="block mb-1 font-bold text-slate-400">Sinopsis</label>
              <textarea id="sinopsis" name="sinopsis" rows="5"
                        class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-sky-500"></textarea>
            </div>
          </div>
        </fieldset>

        <div class="mt-5 flex flex-col sm:flex-row gap-3 sm:items-center">
          <button type="submit" class="bg-sky-500 hover:bg-sky-600 text-white font-bold px-6 py-3 rounded-xl">Simpan</button>
          <button type="reset" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-6 py-3 rounded-xl">Reset</button>
          <a href="daftar-buku.html" class="text-center font-bold text-sky-400 hover:text-sky-300 sm:ml-2">Batal</a>
        </div>
      </form>
    </article>
  </main>

  <footer class="bg-slate-900 border-t border-slate-800 text-center text-slate-400 py-4">
    <p>&copy; 2026 Perpustakaan Umum</p>
  </footer>

</body>
</html>
